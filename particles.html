<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Simulation</title>
<style>
  /* Make the canvas cover the whole screen */
  body, html { margin: 0; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
/* -------------------------------------------------------------
   Particle Simulation
   -------------------------------------------------------------
   Features:
   • Randomly generated particles (colourful, small)
   • Bounce off the edges of the canvas
   • Lines drawn between particles that are close to each other
   • Mouse attraction (feel free to toggle attraction/repulsion)
   • Optional trailing effect by partially clearing the canvas
   ------------------------------------------------------------- */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Resize canvas to window size
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --------------------- Settings ---------------------
const NUM_PARTICLES = 250;
const MAX_SPEED = 1.5;          // Max velocity per axis
const MAX_RADIUS = 3;           // Max particle radius
const LINE_DIST = 120;          // Max distance to draw a line
const TRAIL_ALPHA = 0.05;       // How quickly the trail fades (0 = no trail)

// --------------------- Particle class ---------------------
class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    const speedX = (Math.random() - 0.5) * 2 * MAX_SPEED;
    const speedY = (Math.random() - 0.5) * 2 * MAX_SPEED;
    this.vx = speedX;
    this.vy = speedY;
    this.radius = Math.random() * MAX_RADIUS + 1;
    this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
  }

  update() {
    // Move
    this.x += this.vx;
    this.y += this.vy;

    // Bounce off walls
    if (this.x <= 0 || this.x >= canvas.width) this.vx *= -1;
    if (this.y <= 0 || this.y >= canvas.height) this.vy *= -1;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

// --------------------- Particle Array ---------------------
const particles = Array.from({ length: NUM_PARTICLES }, () => new Particle());

// --------------------- Mouse Interaction ---------------------
let mouse = { x: null, y: null, radius: 200 };

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

// Attraction force (you can switch to repulsion by negating the force)
function applyMouseForce(p) {
  if (!mouse.x) return;
  const dx = mouse.x - p.x;
  const dy = mouse.y - p.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < mouse.radius) {
    const force = (mouse.radius - dist) / mouse.radius;
    const angle = Math.atan2(dy, dx);
    const fx = Math.cos(angle) * force * 0.5; // tweak multiplier for strength
    const fy = Math.sin(angle) * force * 0.5;
    p.vx += fx;
    p.vy += fy;
  }
}

// --------------------- Animation Loop ---------------------
function animate() {
  // Fade the canvas to create a trail effect
  ctx.fillStyle = `rgba(17, 17, 17, ${TRAIL_ALPHA})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Update and draw particles
  for (const p of particles) {
    p.update();
    applyMouseForce(p);          // Comment out this line to disable mouse interaction
    p.draw();
  }

  // Draw lines between close particles
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const pi = particles[i];
      const pj = particles[j];
      const dx = pi.x - pj.x;
      const dy = pi.y - pj.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < LINE_DIST) {
        const alpha = 1 - dist / LINE_DIST;
        ctx.beginPath();
        ctx.moveTo(pi.x, pi.y);
        ctx.lineTo(pj.x, pj.y);
        ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.5})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
